# Server
server.port=${SERVER_PORT:8080}

# SQLite
spring.datasource.url=${DB_URL:jdbc:sqlite:./salaf.db}
spring.datasource.driver-class-name=org.sqlite.JDBC

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect

# JWT - Use environment variables for production
app.jwt.secret=${JWT_SECRET:your-256-bit-secret-key-replace-this-in-production}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# Encryption - Use environment variables for production
app.encryption.key=${ENCRYPTION_KEY:}

# Logging
logging.level.com.salaf.auth.security=${LOG_LEVEL_SECURITY:WARN}
logging.level.org.springframework.security=${LOG_LEVEL_SECURITY:WARN}
logging.level.root=${LOG_LEVEL_ROOT:INFO}

# Audit logging configuration
logging.level.AUDIT=INFO
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

# File logging for audit trail
logging.file.name=logs/salaf-audit.log
logging.logback.rollingpolicy.max-file-size=10MB
logging.logback.rollingpolicy.max-history=30

# Security Headers
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=strict
