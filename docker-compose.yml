version: '3.8'

services:
  web:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "7432:8080"
    environment:
      - JWT_SECRET=your-secure-256-bit-secret-key-change-in-production
      - SERVER_PORT=8080
      - COOKIE_SECURE=false
    volumes:
      - salaf_data:/app/data
      - salaf_logs:/app/logs
    restart: unless-stopped

volumes:
  salaf_data:
  salaf_logs: